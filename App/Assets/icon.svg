<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1e22"/>
      <stop offset="1" stop-color="#101014"/>
    </linearGradient>
    <clipPath id="round"><rect x="0" y="0" width="1024" height="1024" rx="230"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1024" height="1024" fill="url(#bg)"/>

    <!-- outer glow ring -->
    <circle cx="512" cy="400" r="322" fill="none" stroke="#2a2b31" stroke-width="10"/>

    <!-- film reel ring -->
    <circle cx="512" cy="400" r="300" fill="#e8e9ed"/>
    <circle cx="512" cy="400" r="196" fill="#141418"/>

    <!-- sprocket notches -->
    <g fill="#141418">
      <rect x="462" y="60"  width="100" height="34" rx="8"/>
      <rect x="462" y="706" width="100" height="34" rx="8"/>
      <rect x="122" y="316" width="100" height="34" rx="8" transform="rotate(-45 172 333)"/>
      <rect x="802" y="316" width="100" height="34" rx="8" transform="rotate(45 852 333)"/>
      <rect x="232" y="132" width="100" height="34" rx="8" transform="rotate(-67 282 149)"/>
      <rect x="692" y="132" width="100" height="34" rx="8" transform="rotate(67 742 149)"/>
      <rect x="232" y="668" width="100" height="34" rx="8" transform="rotate(67 282 685)"/>
      <rect x="692" y="668" width="100" height="34" rx="8" transform="rotate(-67 742 685)"/>
    </g>

    <!-- center hub -->
    <circle cx="512" cy="400" r="108" fill="#e8e9ed"/>
    <circle cx="512" cy="400" r="90" fill="#141418"/>
    <circle cx="512" cy="400" r="44" fill="#3a3b42"/>
    <circle cx="512" cy="400" r="8" fill="#e8e9ed"/>

    <!-- "24/7" text -->
    <text x="512" y="400" font-family="Helvetica, Arial, sans-serif" font-size="150"
          font-weight="bold" fill="#141418" text-anchor="middle" dominant-baseline="central">24/7</text>

    <!-- caption -->
    <text x="512" y="872" font-family="Helvetica, Arial, sans-serif" font-size="46"
          font-weight="600" letter-spacing="4" fill="#8a8c96" text-anchor="middle">CRITERION TRACKER</text>
  </g>
</svg>