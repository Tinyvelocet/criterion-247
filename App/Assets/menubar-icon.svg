<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Monochrome TEMPLATE icon: only black pixels + alpha. macOS tints it for light/dark. -->
  <!-- A film slate (clapperboard) silhouette. -->
  <g transform="translate(7 15) scale(1.6)">
    <!-- board body -->
    <rect x="0" y="0" width="31" height="21" rx="2"/>
    <!-- angled top arm -->
    <polygon points="2,0 2,9 31,18 31,10 6,0"/>
    <!-- clapper stripes -->
    <g>
      <rect x="6" y="10" width="4" height="3" rx="1"/>
      <rect x="12" y="11.2" width="4" height="3" rx="1"/>
      <rect x="18" y="12.4" width="4" height="3" rx="1"/>
      <rect x="24" y="13.6" width="3" height="3" rx="1"/>
    </g>
    <!-- "24/7" slash note on board -->
    <rect x="8" y="17" width="15" height="1.2" rx="0.6"/>
  </g>
</svg>