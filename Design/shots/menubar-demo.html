<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>menu bar icon</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:#e8e8ea;padding:30px}
  .mb{background:#f5f5f7;border:1px solid #d6d6da;border-radius:10px;padding:9px 16px;
      display:flex;align-items:center;gap:10px;min-width:360px;font-size:14px}
  .mb-black{background:#1e1e22;border:none;margin-top:20px}
  .mb-black .txt,.mb-black .right{color:#cfcfd6}
  .right{margin-left:auto;color:#5a5a60;display:flex;gap:14px;font-size:13px}
  .txt{color:#2a2a30;font-weight:600}
  .live{color:#2e7d32;font-weight:600}
</style></head><body>
  <div class="mb">
    <img src="../App/Assets/menubar-icon-18.png" width="18" height="18">
    <span class="txt">The Housemaid</span>
    <span class="live">● LIVE</span>
    <div class="right"><span>12m left</span><span>🔋</span></div>
  </div>
  <div class="mb mb-black">
    <img src="../App/Assets/menubar-icon-18.png" width="18" height="18" style="filter:invert(1)">
    <span class="txt" style="color:#f5f5f7">The Housemaid</span>
    <span class="live" style="color:#f5b041">● ENDING SOON</span>
    <div class="right"><span>3m left</span></div>
  </div>
</body></html>
