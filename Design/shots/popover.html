<!DOCTYPE html>
<html><head><meta charset="utf-8">
<title>menu bar popover shot</title>
<style>
  :root{--bg:#0d0d0f;--panel:#1a1b1f;--sub:#9a9aa2;--accent:#b9bcc7;--amber:#f5b041;--border:#313238}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);padding:28px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .popover{width:420px;background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden;
           box-shadow:0 20px 60px rgba(0,0,0,.55)}
  .poster{width:100%;aspect-ratio:16/8;object-fit:cover;display:block}
  .popover-body{padding:18px 18px 16px}
  .pop-title{font-size:19px;font-weight:700;margin:0 0 3px;color:#f2f2f4}
  .pop-dir{font-size:13px;color:var(--sub);margin:0 0 8px}
  .pop-cast{font-size:12.5px;color:var(--accent);margin:0 0 4px}
  .pop-writer{font-size:12px;color:var(--sub);margin:0 0 14px}
  .prog{height:6px;background:#2a2b31;border-radius:4px;overflow:hidden;margin-bottom:8px}
  .prog>span{display:block;height:100%;background:var(--accent);border-radius:4px}
  .progrow{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:14px}
  .progrow b{color:#f2f2f4;font-weight:600}
  .pop-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);
            padding:10px 18px 12px;font-size:12px;color:var(--sub)}
  .cbtn{color:var(--accent);font-weight:500;text-decoration:none}
</style></head>
<body>
  <div class="popover">
    <img class="poster" src="https://vhx.imgix.net/criterionchannelchartersu/assets/550da91d-c61d-4206-8786-856fbf07af2e-7ede5590.jpg?auto=format%2Ccompress&amp;fit=crop&amp;h=720&amp;q=75&amp;w=1280">
    <div class="popover-body">
      <p class="pop-title">The Housemaid</p>
      <p class="pop-dir">Directed by Kim Ki-young · 1960 · South Korea</p>
      <p class="pop-cast">Kim Jin-kyu · Ju Jung-nyeo · Lee Eun-shim</p>
      <p class="pop-writer">Written by Kim Ki-young</p>
      <div class="prog"><span style="width:52%"></span></div>
      <div class="progrow"><span><b>58:00</b> / 1:51:00</span><span><b>12 min</b> remaining</span></div>
    </div>
    <div class="pop-foot"><a class="cbtn" href="#">▶ Watch Criterion 24/7</a><span>Updated 1 min ago</span></div>
  </div>
</body></html>
