<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>medium widget</title>
<style>
  :root{--bg:#1a1b1f;--accent:#b9bcc7;--sub:#9a9aa2}
  *{box-sizing:border-box}
  body{margin:0;background:#2c2c31;padding:26px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .widget{width:360px;background:var(--bg);border-radius:22px;overflow:hidden;box-shadow:0 18px 55px rgba(0,0,0,.45)}
  .w-head{position:relative}
  .w-head img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
  .w-head .grad{position:absolute;left:0;right:0;bottom:0;height:70%;background:linear-gradient(to top,var(--bg),transparent)}
  .w-live{position:absolute;top:12px;left:14px;font-size:10.5px;font-weight:600;letter-spacing:.4px;color:#fff;background:#5cb85c;padding:3px 9px;border-radius:20px}
  .badge{position:absolute;right:14px;bottom:2px;font-size:9px;letter-spacing:.5px;color:#737373}
  .w-body{padding:4px 16px 14px}
  .w-title{font-size:18px;font-weight:700;margin:0 0 2px;color:#f2f2f4}
  .w-dir{font-size:12.5px;color:var(--sub);margin:0 0 6px}
  .w-cast{font-size:11.5px;color:var(--accent);margin:0 0 10px}
  .w-prog{height:5px;background:#2a2b31;border-radius:4px;overflow:hidden;margin-bottom:7px}
  .w-prog>span{display:block;height:100%;background:var(--accent)}
  .w-progrow{display:flex;justify-content:space-between;font-size:11px;color:var(--sub)}
  .w-progrow b{color:#f2f2f4}
</style></head><body>
  <div class="widget">
    <div class="w-head">
      <img src="https://vhx.imgix.net/criterionchannelchartersu/assets/550da91d-c61d-4206-8786-856fbf07af2e-7ede5590.jpg?auto=format%2Ccompress&amp;fit=crop&amp;h=720&amp;q=75&amp;w=1280">
      <div class="grad"></div>
      <span class="w-live">● LIVE</span>
      <span class="badge">CRITERION 24/7</span>
    </div>
    <div class="w-body">
      <p class="w-title">The Housemaid</p>
      <p class="w-dir">Directed by Kim Ki-young · 1960 · South Korea</p>
      <p class="w-cast">Kim Jin-kyu · Ju Jung-nyeo · Lee Eun-shim</p>
      <div class="w-prog"><span style="width:52%"></span></div>
      <div class="w-progrow"><span><b>58:00</b> / 1:51:00</span><span>12 min left</span></div>
    </div>
  </div>
</body></html>
