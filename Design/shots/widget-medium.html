<!DOCTYPE html><html><head><meta charset="utf-8"><title>medium</title>
<style>*{box-sizing:border-box;margin:0}body{background:#14151a;width:329px;height:155px;overflow:hidden}

  :root{--bg:#0d0e10;--card:#141518;--accent:#e8e9ed;--sub:#9a9aa2;--amber:#f5b041;--line:#24262b}
  *{box-sizing:border-box}
  body{margin:0;background:#2a2b30;padding:32px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       display:flex;gap:34px;align-items:flex-end;flex-wrap:wrap}
  .widget{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 14px 44px rgba(0,0,0,.5)}
  /* real macOS sizes in points (pt); downscale for web not needed */
  .w-small{width:155px;height:155px}
  .w-medium{width:329px;height:155px}
  .w-large{width:329px;height:345px}
  .poster{width:100%;object-fit:cover;display:block}
  .title{font-weight:700;color:#f4f4f6}
  .crumb{color:var(--sub)}
  .cast{color:var(--accent);opacity:.85}
  .prog{height:5px;background:#2a2b31;border-radius:3px;overflow:hidden}
  .prog>span{display:block;height:100%;background:var(--accent);border-radius:3px}
  .progrow{display:flex;justify-content:space-between;color:var(--sub);font-size:9px}
  .live{display:inline-block;color:#fff;background:#2e8b57;border-radius:20px;padding:1px 7px;font-size:8.5px;font-weight:600;letter-spacing:.4px}

  /* small */
  .s-body{padding:7px 9px 9px}
  .s-title{font-size:13px;margin:0 0 1px}
  .s-crumb{font-size:9px;margin:0 0 6px}
  /* medium */
  .m-post{height:68px}
  .m-body{padding:8px 12px 10px}
  .m-title{font-size:15px;margin:0 0 1px}
  .m-crumb{font-size:10px;margin:0 0 5px}
  /* large */
  .l-post{height:150px}
  .l-body{padding:10px 14px 12px}
  .l-title{font-size:18px;margin:0 0 2px}
  .l-crumb{font-size:11px;margin:0 0 3px}
  .l-cast{font-size:10px;margin:0 0 2px}
  .l-writer{font-size:10px;color:var(--sub);margin:0 0 9px}

.widget{border-radius:20px;overflow:hidden}</style></head>
<body><div><div class="widget w-medium">
  <img class="poster m-post" src="https://vhx.imgix.net/criterionchannelchartersu/assets/550da91d-c61d-4206-8786-856fbf07af2e-7ede5590.jpg?auto=format%2Ccompress&amp;fit=crop&amp;h=720&amp;q=75&amp;w=1280">
  <div class="m-body">
    <p class="title m-title"><span class="live" style="margin-right:6px">● LIVE</span>The Housemaid</p>
    <p class="crumb m-crumb">Directed by Kim Ki-young · 1960 · South Korea</p>
    <p class="cast m-crumb" style="margin-top:-2px">Kim Jin-kyu · Ju Jung-nyeo · Lee Eun-shim</p>
    <div class="prog" style="margin-top:6px"><span style="width:52%"></span></div>
    <div class="progrow"><span>58:00 / 1:51:00</span><span>12 min left</span></div>
  </div>
</div></div></body></html>
