name: Criterion247
options:
  bundleIdPrefix: dev.criterion247
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  CriterionData:
    path: ./Data
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: WW4KSN8655
    CODE_SIGN_STYLE: Automatic
    MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  Criterion247:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Assets/AppIcon.iconset"
          - "Assets/icon.svg"
          - "Assets/icon-1024.png"
    dependencies:
      - package: CriterionData
      - target: Criterion247Widget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.criterion247
        PRODUCT_NAME: Criterion247
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: App/Criterion247.entitlements
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
  Criterion247Widget:
    type: app-extension
    platform: macOS
    sources: [Widget]
    dependencies:
      - package: CriterionData
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.criterion247.widget
        PRODUCT_NAME: Criterion247Widget
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Widget/Criterion247Widget.entitlements
        SKIP_INSTALL: YES
        INFOPLIST_KEY_CFBundleDisplayName: Criterion24/7
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  Criterion247:
    build:
      targets:
        Criterion247: all
        Criterion247Widget: all
    run:
      config: Debug
    archive:
      config: Release